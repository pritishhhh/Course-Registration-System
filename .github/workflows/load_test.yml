name: Concurrency Load Test

on:
  workflow_dispatch:
    inputs:
      students:
        description: 'Number of students to simulate racing for seats'
        required: true
        default: '500'
        type: string
      threads:
        description: 'Number of concurrent workers (threads)'
        required: true
        default: '50'
        type: string

jobs:
  run-load-test:
    runs-on: ubuntu-latest
    
    # Run a PostgreSQL service container alongside the runner
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: registration
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Initialize Database Schema
        env:
          PGPASSWORD: postgres
        run: |
          # The github actions runner comes with psql installed
          psql -h localhost -U postgres -d registration -f db/01_schema.sql
          psql -h localhost -U postgres -d registration -f db/02_procedures.sql
          psql -h localhost -U postgres -d registration -f db/03_triggers.sql
          psql -h localhost -U postgres -d registration -f db/04_seed.sql

      - name: Install Dependencies
        run: |
          cd scripts
          pip install -r requirements.txt

      - name: Run Load Test
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: registration
          PGUSER: postgres
          PGPASSWORD: postgres
          NUM_STUDENTS_TO_TRY: ${{ github.event.inputs.students }}
          NUM_THREADS: ${{ github.event.inputs.threads }}
        run: |
          cd scripts
          python concurrency_test_multi.py
