name: Database and API checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      students:
        description: Number of simulated students (1-20000)
        default: '500'
      threads:
        description: Concurrent workers (1-80)
        default: '20'
      subjects:
        description: Course sections (1-4)
        default: '4'
      capacity:
        description: Seats per section
        default: '30'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: registration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/registration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Initialize disposable database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/registration_test
        run: python scripts/init_db.py
      - run: python -m pytest -q
      - name: Threaded load test
        env:
          NUM_STUDENTS_TO_TRY: ${{ inputs.students || '200' }}
          NUM_THREADS: ${{ inputs.threads || '20' }}
          NUM_SUBJECTS: ${{ inputs.subjects || '4' }}
          SUBJECT_CAPACITY: ${{ inputs.capacity || '30' }}
        run: python scripts/concurrency_test_multi.py
