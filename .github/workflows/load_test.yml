name: Concurrency Load Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      students:
        description: 'Number of students to simulate racing for seats'
        required: true
        default: '500'
        type: string
      threads:
        description: 'Number of concurrent workers (threads)'
        required: true
        default: '50'
        type: string
      subjects:
        description: 'Number of subjects to include (1 to 4)'
        required: true
        default: '4'
        type: string
      capacity:
        description: 'Number of enrollments (capacity) per subject'
        required: true
        default: '30'
        type: string

jobs:
  run-load-test:
    runs-on: ubuntu-latest
    
    # Run a PostgreSQL service container alongside the runner
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: registration
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt -r scripts/requirements.txt

      - name: Initialize Database Schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/registration
          PGPASSWORD: postgres
        run: |
          python scripts/apply_schema.py
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d registration -f db/04_seed.sql

      - name: Verify web flow
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/registration
          SECRET_KEY: ci-only-test-secret
          ALLOWED_HOSTS: testserver,localhost
          DEBUG: '1'
        run: |
          python manage.py migrate --noinput
          python manage.py check
          python manage.py seed_demo
          python manage.py seed_demo
          python scripts/verify_web.py

      - name: Verify registration invariants
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: registration
          PGUSER: postgres
          PGPASSWORD: postgres
        run: python scripts/verify_registration.py

      - name: Run comparative load demo
        if: github.event_name == 'workflow_dispatch'
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: registration
          PGUSER: postgres
          PGPASSWORD: postgres
          NUM_STUDENTS_TO_TRY: ${{ github.event.inputs.students }}
          NUM_THREADS: ${{ github.event.inputs.threads }}
          NUM_SUBJECTS: ${{ github.event.inputs.subjects }}
          SUBJECT_CAPACITY: ${{ github.event.inputs.capacity }}
        run: |
          cd scripts
          python concurrency_test_multi.py
